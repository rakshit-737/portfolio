name: Deploy to GitHub Pages

# F1 (final fix wave): this used to fire on `push: branches: [main]`
# independently of `ci.yml` — a red quality-gate run did not stop a deploy.
# Observed live: a push that failed lint/build/tests still shipped to
# production because this workflow has no knowledge of that failure: two
# separate `on: push` triggers race the same event with no ordering between
# them. Gating on `workflow_run` makes this workflow depend on "CI quality
# gate" actually finishing, and the `if:` below refuses to deploy unless it
# concluded `success` — so a broken build, a failing test, or a budget
# breach now blocks the deploy the same way it always should have.
on:
  workflow_run:
    workflows: ["CI quality gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild keeps the footer's "record generated" date honest.
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # `github.event.workflow_run` only exists when this run was triggered by
    # the `workflow_run` event above — `workflow_dispatch` and `schedule`
    # carry no such object, so the first half of this OR keeps both of those
    # triggers working exactly as before (see the brief's "keep
    # workflow_dispatch and schedule working"). When it IS a workflow_run,
    # the run must have actually succeeded — a `cancelled`/`failure`
    # conclusion on "CI quality gate" stops the deploy here.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI validated, not whatever `main` points
          # to by the time this job starts — the two can differ if another
          # push landed in between. `workflow_dispatch`/`schedule` carry no
          # `workflow_run` object, so they fall back to the default ref
          # (the branch this workflow itself runs on).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Project pages (user.github.io/repo) need a base path; a user page
      # (repo named user.github.io) does not.
      - name: Compute Pages URLs
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io/$REPO" >> "$GITHUB_ENV"
          fi

      # Token raises the GitHub API rate limit for the build-time
      # live-evidence fetch (stars / head commit / CI status).
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
