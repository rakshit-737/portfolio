name: CI quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify plate integrity
        run: npm run check:art

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Token raises the GitHub API rate limit for the build-time
      # live-evidence fetch (stars / head commit / CI status).
      - name: Build static export
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Performance budget (gzipped JS)
        run: node scripts/check-budget.mjs

      - name: Link integrity crawl (out/)
        run: npm run check:links

      - name: Content lint (the stranger test)
        run: npm run check:content

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests + axe scan (against ./out)
        run: npx playwright test

      - name: Lighthouse gate
        run: |
          npx serve out -l 4573 &
          sleep 3
          node scripts/check-lighthouse.mjs http://localhost:4573/

      # P6-perf item 5: measurement, not a gate. Never wired into the job's
      # pass/fail — `if: always()` runs it even if the Lighthouse gate
      # above failed, and `continue-on-error: true` means a problem inside
      # this step itself (e.g. the throwaway server not coming up in time)
      # can't fail the job either. scripts/scroll-trace.mjs documents the
      # ratchet thresholds (LCP, TBT) a later hard gate would enforce.
      - name: Scroll-trace report (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          npx serve out -l 4574 &
          sleep 3
          node scripts/scroll-trace.mjs http://localhost:4574/ | tee scroll-trace.log

      - name: Upload scroll-trace report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scroll-trace-report
          path: scroll-trace.log
          if-no-files-found: ignore
